backend:
  name: github
  repo: Adrihp06/adrihp_dev
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog article sources (English)
    files:
      - name: jev
        label: JEV and Travel Ruter
        file: posts/jev-travel-ruter-context-cache-agent-efficiency/web/article-en.md
        fields:
          - { label: Article, name: body, widget: markdown }
      - name: mnemosyne
        label: Mnemosyne
        file: posts/mnemosyne-bug-bounty-duplicate-detection/web/article-en.md
        fields:
          - { label: Article, name: body, widget: markdown }
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Repository URL, name: repo, widget: string, required: false }
      - { label: Live URL, name: link, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
