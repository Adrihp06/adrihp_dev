<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Normalize the report, preserve the exploit</title><desc id="desc">Normalization extracts fields without modifying payloads, paths or regular expressions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#365b47"/></marker></defs><rect width="1000" height="630" fill="#f5f6f1"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#263b35" font-weight="600">Normalize the report, preserve the exploit</text><text x="40" y="92" font-family="Arial, sans-serif" font-size="19" fill="#53655f" font-weight="400">Structure changes. Technical artifacts do not.</text><rect x="40" y="135" width="410" height="240" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="62" y="171" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Raw report</text><text x="62" y="204" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Narrative description</text><text x="62" y="231" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Vulnerability details</text><text x="62" y="258" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Code and payloads</text><text x="62" y="285" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Steps to reproduce</text><path d="M450 255H540" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="135" width="410" height="240" rx="8" fill="#e2eade" stroke="#acbbb0"/><text x="572" y="171" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Structured report</text><text x="572" y="204" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Vulnerability type + severity</text><text x="572" y="231" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Affected components</text><text x="572" y="258" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Technical artifacts</text><text x="572" y="285" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Reproduction steps</text><text x="40" y="426" font-family="Arial, sans-serif" font-size="20" fill="#263b35" font-weight="600">Normalization · Claude Sonnet 4.5</text><rect x="40" y="460" width="920" height="135" rx="8" fill="#263b35"/><text x="65" y="498" font-family="Arial, sans-serif" font-size="23" fill="#f5f6f1" font-weight="600">Preserved character-for-character</text><text x="65" y="543" font-family="Arial, sans-serif" font-size="20" fill="#d3e3d9" font-weight="400">Payloads: \u0000     ·     Paths: /api/v1/login     ·     Regex patterns</text></svg>
