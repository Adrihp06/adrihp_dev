<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">The investigation loop</title><desc id="desc">The agent chooses a query, calls retrieval, inspects evidence and either refines its search or returns an assessment. The early stopping hook uses a score above 0.9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#365b47"/></marker></defs><rect width="1000" height="690" fill="#f5f6f1"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#263b35" font-weight="600">The investigation loop</text><text x="40" y="92" font-family="Arial, sans-serif" font-size="19" fill="#53655f" font-weight="400">Search, inspect, refine. Stop when there is sufficient evidence.</text><rect x="40" y="150" width="270" height="130" rx="8" fill="#e2eade" stroke="#acbbb0"/><text x="62" y="186" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Reason</text><text x="62" y="219" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Choose a search angle</text><text x="62" y="246" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Description, payload, path</text><path d="M310 215H365" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="375" y="150" width="255" height="130" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="397" y="186" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Act</text><text x="397" y="219" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Hybrid retrieval</text><text x="397" y="246" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Cross-encoder re-ranking</text><path d="M630 215H685" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="150" width="265" height="130" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="717" y="186" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Observe</text><text x="717" y="219" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Inspect candidates</text><text x="717" y="246" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Verify component + vector</text><path d="M825 280V360H180V290" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="346" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Evidence incomplete → refine the query</text><path d="M825 360V420" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="430" width="440" height="115" rx="8" fill="#e2eade" stroke="#acbbb0"/><text x="542" y="466" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Return an assessment</text><text x="542" y="499" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Duplicate · Similar · New</text><text x="40" y="620" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Early stopping hook: top score &gt; 0.9</text><text x="40" y="653" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Decision thresholds and the hook serve different roles.</text></svg>
