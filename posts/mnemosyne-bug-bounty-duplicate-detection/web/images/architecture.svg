<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Mnemosyne: retrieval meets reasoning</title><desc id="desc">A corpus of normalized reports is indexed in Qdrant. A new normalized report enters a ReAct agent, which calls hybrid retrieval and FlashRank before returning an assessment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#365b47"/></marker></defs><rect width="1000" height="740" fill="#f5f6f1"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#263b35" font-weight="600">Mnemosyne: retrieval meets reasoning</text><text x="40" y="92" font-family="Arial, sans-serif" font-size="19" fill="#53655f" font-weight="400">Stored evidence and an agent that investigates before deciding.</text><rect x="40" y="135" width="280" height="110" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="62" y="171" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Report corpus</text><text x="62" y="204" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Normalized existing reports</text><path d="M320 190H370" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="135" width="580" height="110" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="402" y="171" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Qdrant · hybrid index</text><text x="402" y="204" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Dense: BGE embeddings     +     Sparse: BM25</text><rect x="40" y="315" width="280" height="130" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="62" y="351" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">New report</text><text x="62" y="384" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Claude Sonnet 4.5</text><text x="62" y="411" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Structured normalization</text><path d="M320 380H370" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="305" width="260" height="150" rx="8" fill="#e2eade" stroke="#acbbb0"/><text x="402" y="341" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">ReAct agent</text><text x="402" y="374" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Claude Agent SDK</text><text x="402" y="401" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Reason → act → observe</text><rect x="700" y="305" width="260" height="150" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="722" y="341" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Retrieval tool</text><text x="722" y="374" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Hybrid search + RRF</text><text x="722" y="401" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">FlashRank re-ranking</text><path d="M640 350H690" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 413H650" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 305V255" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><text x="705" y="495" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Ranked candidates</text><path d="M510 455V540" fill="none" stroke="#365b47" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="550" width="580" height="100" rx="8" fill="#ffffff" stroke="#acbbb0"/><text x="402" y="586" font-family="Arial, sans-serif" font-size="23" fill="#263b35" font-weight="600">Assessment + reasoning</text><text x="402" y="619" font-family="Arial, sans-serif" font-size="18" fill="#53655f" font-weight="400">Duplicate, similar or new report</text><text x="40" y="708" font-family="Arial, sans-serif" font-size="16" fill="#53655f" font-weight="400">Conceptual architecture · Original publication: December 2025</text></svg>
